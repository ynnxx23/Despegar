# e2e móvil con Maestro (https://maestro.mobile.dev).
# Requiere: apps instaladas en dev (expo start) + backend :8000 + BD migrada.
# Uso: maestro test tests/e2e/viajero.yaml
appId: com.despegar.viajero
---
- launchApp
- tapOn: "Viajero"
- inputText: "ana@test.com"
- tapOn: "Contraseña"
- inputText: "Viaje1234"
- tapOn: "Entrar"
- assertVisible: "Mis viajes"
- tapOn: "Reportar"
- tapOn: "Vuelo cancelado"
- tapOn: "Enviar reporte"
- assertVisible: "Reporte #"
- tapOn: "Mis incidentes"
- assertVisible: "Vuelo cancelado"
