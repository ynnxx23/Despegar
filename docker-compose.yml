services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: despegar
      POSTGRES_USER: despegar
      POSTGRES_PASSWORD: ${DB_PASS:-cambiar_por_tu_password_local}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
  api:
    image: php:8.2-apache
    depends_on:
      - postgres
    ports:
      - "8000:80"
    volumes:
      - ../backend:/var/www/html:ro
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: despegar
      DB_USER: despegar
      DB_PASS: ${DB_PASS:-cambiar_por_tu_password_local}
      JWT_SECRET: ${JWT_SECRET:-cambiar_por_secreto_aleatorio_de_32_bytes_minimo}
      BCRYPT_COST: "10"
      JWT_TTL_HOURS: "8"
      REFRESH_TTL_DAYS: "30"
      APP_ENV: development
      CORS_ORIGIN: "*"
volumes:
  pgdata:
