services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: despegar
      POSTGRES_USER: despegar
      POSTGRES_PASSWORD: ${DB_PASS:-cambiar_por_tu_password_local}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db:/docker-entrypoint-initdb.d:ro
  api:
    image: php:8.2-apache
    depends_on:
      - postgres
    ports:
      - "8000:80"
    volumes:
      - ../backend:/var/www/html:ro
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: despegar
      DB_USER: despegar
      DB_PASS: ${DB_PASS:-cambiar_por_tu_password_local}
volumes:
  pgdata:
